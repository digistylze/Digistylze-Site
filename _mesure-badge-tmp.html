<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>mesure</title>
<style>
  /* variable : wght 100..800, wdth 75..112.5 */
  @font-face{font-family:"MM Var";src:url(/_mm_var.woff2) format("woff2");
    font-weight:100 800; font-stretch:75% 112.5%; font-display:block}
  /* statique tel que servi aujourd'hui : wdth fige a 100% */
  @font-face{font-family:"MM Static";src:url(/_mm_static.woff2) format("woff2");
    font-weight:300; font-stretch:100%; font-display:block}
  @font-face{font-family:"MM Static";src:url(/_mm_static.woff2) format("woff2");
    font-weight:400; font-stretch:100%; font-display:block}
  @font-face{font-family:"MM Static";src:url(/_mm_static.woff2) format("woff2");
    font-weight:600; font-stretch:100%; font-display:block}
  body{font-family:system-ui;background:#F4F2EA;color:#101114;padding:16px}
  .probe{position:absolute;visibility:hidden;white-space:nowrap;text-transform:uppercase;line-height:1}
  pre{font-size:12px;line-height:1.45}
</style></head><body>
<pre id="res">chargement…</pre>
<script>
const T1 = "Idéal pour lancer";   // 17 signes
const T2 = "Populaire";           //  9 signes
function w(text, size, weight, stretch, ls, fam){
  const s = document.createElement('span');
  s.className='probe';
  s.style.fontFamily = fam;
  s.style.fontSize = size+'px';
  s.style.fontWeight = weight;
  s.style.fontStretch = stretch+'%';
  s.style.letterSpacing = ls+'em';
  s.textContent = text;
  document.body.appendChild(s);
  const r = s.getBoundingClientRect().width;
  s.remove();
  return r;
}
Promise.all([
  document.fonts.load('800 13px "MM Var"'),
  document.fonts.load('600 13px "MM Static"'),
  document.fonts.load('400 13px "MM Static"')
]).then(()=>document.fonts.ready).then(()=>{
  const L=[];
  L.push('MM Var 800 charge  : '+document.fonts.check('800 13px "MM Var"'));
  L.push('MM Static 600      : '+document.fonts.check('600 13px "MM Static"'));
  L.push('');
  const V='"MM Var", monospace', S='"MM Static", monospace';
  L.push('=== A. metrique de base (wdth 100) ===');
  const a400 = w('MMMMMMMMMM',100,400,100,0,V)/10;
  const a800 = w('MMMMMMMMMM',100,800,100,0,V)/10;
  const a800c= w('MMMMMMMMMM',100,800,87.5,0,V)/10;
  const a800d= w('MMMMMMMMMM',100,800,82.5,0,V)/10;
  L.push('avance/car  wght400 wdth100 : '+(a400/100).toFixed(4)+' em');
  L.push('avance/car  wght800 wdth100 : '+(a800/100).toFixed(4)+' em');
  L.push('avance/car  wght800 wdth87.5: '+(a800c/100).toFixed(4)+' em  (-'+((1-a800c/a800)*100).toFixed(1)+'%)');
  L.push('avance/car  wght800 wdth82.5: '+(a800d/100).toFixed(4)+' em  (-'+((1-a800d/a800)*100).toFixed(1)+'%)');
  L.push('');
  L.push('=== B. largeur du TEXTE (px) ===');
  const rows=[
   ['ACTUEL   9.5 / 400 / wdth100 / .10em', S, 9.5,400,100,.10],
   ['A        13  / 800 / wdth87.5/ .20em', V, 13, 800, 87.5, .20],
   ['A-       13  / 800 / wdth87.5/ .18em', V, 13, 800, 87.5, .18],
   ['A--      13  / 800 / wdth87.5/ .16em', V, 13, 800, 87.5, .16],
   ['B        12.5/ 800 / wdth87.5/ .20em', V, 12.5,800,87.5,.20],
   ['C        12  / 800 / wdth87.5/ .20em', V, 12, 800, 87.5, .20],
   ['D        13  / 800 / wdth82.5/ .20em', V, 13, 800, 82.5, .20],
   ['E        14  / 800 / wdth82.5/ .18em', V, 14, 800, 82.5, .18],
   ['REPLI    13  / 800 / wdth100 / .20em', V, 13, 800, 100, .20],
   ['REPLI-S  13  / 800 -> static 600      ', S, 13, 800, 100, .20],
  ];
  L.push('cas                                    IDEAL POUR LANCER   POPULAIRE');
  for(const [lbl,f,sz,wt,st,ls] of rows){
    const x=w(T1,sz,wt,st,ls,f), y=w(T2,sz,wt,st,ls,f);
    L.push(lbl.padEnd(40)+x.toFixed(1).padStart(10)+y.toFixed(1).padStart(12));
  }
  L.push('');
  L.push('=== C. pastille complete (texte + paddings + etoile) ===');
  function pill(sz,wt,st,ls,padL,padR,gap,star,fam,txt){
    const t=w(txt,sz,wt,st,ls,fam);
    // le crenage de fin (letter-spacing apres la derniere lettre) est compris dans t
    return t+padL+padR+(star? gap+star : 0);
  }
  const cases=[
   ['A 13/800/87.5/.20  pad 18|16', 13,800,87.5,.20,18,16],
   ['B 12.5/800/87.5/.20 pad 17|15',12.5,800,87.5,.20,17,15],
   ['D 13/800/82.5/.20  pad 18|16', 13,800,82.5,.20,18,16],
   ['REPLI wdth100 13/800 pad 18|16',13,800,100,.20,18,16],
  ];
  for(const [lbl,sz,wt,st,ls,pl,pr] of cases){
    const s1=pill(sz,wt,st,ls,pl,pr,0,0,V,T1);
    const st2=Math.round(sz*0.9*10)/10;
    const s2=pill(sz,wt,st,ls,pl,pr,5,st2,V,T2);
    L.push(lbl.padEnd(32)+' carte1='+s1.toFixed(1).padStart(7)+' px   vedette='+s2.toFixed(1).padStart(7)+' px');
  }
  L.push('');
  L.push('=== D. budget de largeur des cartes ===');
  const budgets=[['viewport 900px (bascule 3 col)',266.4],['viewport 1000px',296.0],['viewport 1200px',355.2],['viewport >=1500px',346.7],['mobile 375px',335.0],['mobile 320px',280.0]];
  for(const [lbl,cw] of budgets) L.push(lbl.padEnd(34)+'carte='+cw.toFixed(1).padStart(6)+' px   dispo (marge 16px/cote)='+(cw-32).toFixed(1).padStart(6)+' px');
  L.push('');
  L.push('=== E. hauteur de capitale ===');
  const c=document.createElement('canvas').getContext('2d');
  c.font='800 200px "MM Var"';
  const m=c.measureText('H');
  L.push('capHeight = '+(m.actualBoundingBoxAscent/200).toFixed(3)+' em  -> a 13px = '+(m.actualBoundingBoxAscent/200*13).toFixed(2)+' px');
  c.font='400 200px "MM Var"';
  const m0=c.measureText('H');
  L.push('capHeight w400 = '+(m0.actualBoundingBoxAscent/200).toFixed(3)+' em -> a 9.5px = '+(m0.actualBoundingBoxAscent/200*9.5).toFixed(2)+' px');
  document.getElementById('res').textContent=L.join('\n');
});
</script></body></html>
